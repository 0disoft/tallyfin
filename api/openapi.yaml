        Owner grant and privacyReviewed=true required. The body is at most 33792
        UTF-8 bytes; canonical event/workflow definitions remain limited to 32768.
        New versions must exceed the highest published version and match
        expectedLatestVersion. Same-version identical-definition retries return
        existing metadata, even after later versions are published or the target
        is retired. Retry does not reactivate it. A conflicting definition or
        stale highest-version snapshot returns schema_conflict (409).
        Versioned PUT is idempotent and requires no separate idempotency key.
        Authorization is rechecked inside the atomic write. Project settings,
        earlier versions and aggregates are preserved; earlier schemas remain
        active until retired separately. SDKs must explicitly select the new version.
