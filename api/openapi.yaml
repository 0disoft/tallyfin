  /v1/projects:
    post:
      tags: [Administration]
      operationId: createProject
      summary: Create a project with an owner grant for the verified creator
      description: Requires explicit issuer/subject permission in project_creators; existing project ownership is insufficient.
        Identity-encoded JSON or text/plain, at most 16KiB; no query parameters.
        Permission and per-principal 1..1000 project quota are checked at insertion.
        Project, immutable receipt and owner grant are written atomically. No schema is invented.
        Idempotency is keyed by project ID plus verified creator and canonical initial request, so no Idempotency-Key header is needed.
        A matching retry returns the original receipt even after settings edits or quota exhaustion;
        creator permission and current owner role are still required. Retries never restore revoked grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreation"
          text/plain:
            schema:
              $ref: "#/components/schemas/ProjectCreation"
      responses:
        "200":
          description: Project created or identical prior creation confirmed; original immutable receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedProject"
        "400":
          description: Invalid JSON, closed input, time zone, origin, limit or query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Verified administrator authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Explicit creation permission missing or revoked, or replaying creator is no longer an owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: project_conflict for an occupied ID or different initial request; project_limit_reached for exhausted creation quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET and POST are supported on this path.
          headers:
            Allow:
              schema:
                type: string
                const: GET, POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 16KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type or content encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable; ambiguous outcomes can be recovered with an identical retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
