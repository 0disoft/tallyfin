    put:
      tags: [Administration]
      operationId: publishProjectSchema
      summary: Publish a new immutable schema version
      description: >-
        Owner grant and privacyReviewed=true required. The body is at most 33792
        UTF-8 bytes; canonical event/workflow definitions remain limited to 32768.
        New versions must exceed the highest published version and match
        expectedLatestVersion. Same-version identical-definition retries return
        existing metadata, even after later versions are published or the target
        is retired. Retry does not reactivate it. A conflicting definition or
        stale highest-version snapshot returns schema_conflict (409).
        Versioned PUT is idempotent and requires no separate idempotency key.
        Authorization is rechecked inside the atomic write. Project settings,
        earlier versions and aggregates are preserved; earlier schemas remain
        active until retired separately. SDKs must explicitly select the new version.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: schemaVersion
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaPublication"
          text/plain:
            schema:
              $ref: "#/components/schemas/SchemaPublication"
      responses:
        "200":
          description: Published or existing identical version metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedSchema"
        "400":
          description: Invalid JSON, envelope, definitions, privacy review or parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner grant required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Schema version or latest-version conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request exceeds 33792 UTF-8 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type, charset or encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable; read the target version before retrying after a lost response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET and PUT are supported for versioned schemas.
          headers:
            Allow:
              schema:
                type: string
                const: GET, PUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
