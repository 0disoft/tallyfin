  /v1/projects/{projectId}/changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Administration]
      operationId: listAdminChanges
      summary: List recent administrator changes as project owner
      description: Requires current owner authority on every page. Authorization and records share one database snapshot.
        Returns only recorded API and offline provisioning changes within the rolling 90 days up to generatedAt.
        Excludes expired rows even before physical cleanup. No backfill or capture of direct SQL writes, global creator
        permissions, system maintenance or visitor activity. Empty history does not prove that no changes occurred.
        Sorts by occurredAt descending then record UUID descending in SQLite BINARY order. The project-bound cursor is
        only a position, never authority. Pages are live reads; later records require restarting from the first page.
        Duplicate or unknown query parameters and query strings longer than 512 characters are rejected.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512, pattern: "^[A-Za-z0-9_-]*$" }
          description: Previous nextCursor, omitted or empty for the first page. Malformed and cross-project cursors fail.
      responses:
        "200":
          description: Minimal history metadata with no setting values, definitions, tokens or raw requests. Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChangePage" }
        "400":
          description: Invalid project ID, pagination or query parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Administrator authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: No current owner grant, including missing projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              schema: { type: string, const: GET }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Storage unavailable or invalid stored history. No fabricated empty response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/projects/{projectId}/grants:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Administration]
      operationId: listProjectGrants
      summary: List project reader and owner grants
      description: Requires a current owner grant, reapplied on every page. Rows and permission share one database snapshot.
        Ordered by issuer then subject in SQLite BINARY order. Includes paused projects and projects without schemas.
        Cursor is an opaque project-bound position, not an authorization claim; clients must reuse it unchanged.
        Pages are live reads, so concurrent grants inserted before the cursor require restarting the list.
        Duplicate/extra query parameters and query strings longer than 12352 characters are rejected.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 12288
            pattern: ^[A-Za-z0-9_-]*$
          description: Previous nextCursor, omitted or empty for the first page. Malformed and cross-project cursors are rejected.
      responses:
        "200":
          description: Project grants and next page position; Cache-Control no-store. Only provisioned issuer/subject, role and creation time; no tokens or profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGrantPage"
        "400":
          description: Invalid project ID, pagination or query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Administrator authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No current owner grant, including missing projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET, PUT and DELETE are supported.
          headers:
            Allow:
              schema:
                type: string
                const: GET, PUT, DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable or invalid stored grant data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Administration]
      operationId: putProjectGrant
      summary: Add or change a reader or owner grant as owner
      description: Requires a current owner grant. Ownership is checked before the body is read and rechecked inside one atomic
        database batch with the write, so a revoked owner cannot mutate. The closed body holds only issuer, subject, role and
        expectedRole with the same identity constraints as the provisioning CLI. expectedRole is the role the caller last
        observed; null registers a new grant, reader or owner is a compare-and-swap guard. When the target already holds the
        requested role the request succeeds with changed=false and writes nothing, including an exact retry of an earlier
        success. A different stored role returns grant_conflict (409). Moving the last remaining owner down to reader returns
        last_owner (409). A caller may also demote their own grant while another owner remains; the response then reports
        canManage=false and later owner calls fail with 403. Role changes preserve the original createdAt. No query parameters.
      requestBody:
        required: true
        description: UTF-8 JSON, at most 16 KiB; identity content encoding only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantChangeRequest"
          text/plain:
            schema:
              $ref: "#/components/schemas/GrantChangeRequest"
      responses:
        "200":
          description: Stored grant after the write, or unchanged metadata when the requested role was already present; no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantMutationResult"
        "400":
          description: Invalid project ID, unexpected query parameters, malformed JSON or invalid identity fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Administrator authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No current owner grant, including missing projects or ownership revoked before the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET, PUT and DELETE are supported.
          headers:
            Allow:
              schema:
                type: string
                const: GET, PUT, DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stored role no longer matches expectedRole (grant_conflict), or the last owner cannot be demoted (last_owner).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type or encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable; read the grant list before retrying because the earlier outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Administration]
      operationId: deleteProjectGrant
      summary: Revoke a reader or owner grant as owner
      description: Requires a current owner grant, checked before the body is read and rechecked inside one atomic database
        batch with the delete. The closed body holds only issuer, subject and expectedRole. expectedRole is the role the caller
        last observed; null states the caller saw no grant and the revoke of an absent grant is an idempotent success,
        reader or owner is a compare-and-swap guard. A stored role that differs from expectedRole returns grant_conflict
        (409). Revoking the last remaining owner returns last_owner (409). A caller may revoke their own grant while another
        owner remains; the response then reports canManage=false and later owner calls fail with 403. No query parameters.
      requestBody:
        required: true
        description: UTF-8 JSON, at most 16 KiB; identity content encoding only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRevokeRequest"
          text/plain:
            schema:
              $ref: "#/components/schemas/GrantRevokeRequest"
      responses:
        "200":
          description: Grant state after the revoke; role and createdAt are null when no grant remains, and an absent grant is an unchanged success; no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantMutationResult"
        "400":
          description: Invalid project ID, unexpected query parameters, malformed JSON or invalid identity fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Administrator authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No current owner grant, including missing projects or ownership revoked before the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET, PUT and DELETE are supported.
          headers:
            Allow:
              schema:
                type: string
                const: GET, PUT, DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stored role no longer matches expectedRole (grant_conflict), or the last owner cannot be revoked (last_owner).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type or encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable; read the grant list before retrying because the earlier outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
