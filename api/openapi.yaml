      tags: [Administration]
      operationId: validateProjectSchemaDraft
      summary: Validate unpublished definitions without saving them
      description: >-
        Owner grant required, including for paused projects. Authentication and
        project ownership are checked before reading the body. Accepts at most
        32768 UTF-8 bytes with identity encoding and no query parameters. Semantic
        definition errors return 200 with valid=false; malformed envelopes return
        400. No drafts, schemas, settings, quotas or aggregates are written.
        Repeating this read-only operation has no side effects and needs no idempotency key.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
