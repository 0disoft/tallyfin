              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Administration]
      operationId: updateProjectSettings
      summary: Update project settings as owner
      description: Requires a verified principal and owner grant rechecked atomically at write time. No query parameters.
        A stale hash or concurrent settings edit returns settings_conflict (409); ingestion alone does not cause a conflict.
        After a lost response or 409, read current settings and compare before retrying; never blindly replace the hash.
        Updates advance the ingestion guard revision, preserve all aggregates and do not reset consumed quotas.
      requestBody:
        required: true
        description: UTF-8 JSON, at most 16 KiB; identity content encoding only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSettingsUpdate"
          text/plain:
            schema:
              $ref: "#/components/schemas/ProjectSettingsUpdate"
      responses:
        "200":
          description: Saved settings and new hash; no-store. Identical settings keep the same content hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "400":
          description: Invalid JSON, settings, hash, project ID or query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Administrator authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No owner grant, including missing projects or revoked ownership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET and PATCH are supported for project settings.
          headers:
            Allow:
              schema:
                type: string
                const: GET, PATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Settings conflict; reload and reconcile the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type or encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable; read settings before retrying because the earlier outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
